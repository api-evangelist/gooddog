aid: gooddog
name: Good Dog
description: >-
  Good Dog is a marketplace that connects people looking for a dog with a vetted national
  network of ethical breeders, animal shelters, and rescues. The platform screens every
  source against standards developed with veterinary experts, requires all payments to be
  processed securely on-platform to protect both buyers and sellers, and supports new
  owners with a Learning Center, lifetime access to Care Specialists, puppy training
  resources, and pet insurance options. Over 250,000 families have found their dog through
  Good Dog. It is a consumer-facing web and mobile marketplace; as of this profile no
  public developer API, SDK, or integration program is published. Surfaced as a portfolio
  company of Felicis and profiled in the API Evangelist network.
